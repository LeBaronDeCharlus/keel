# cargo-deny configuration. Run `cargo deny check` locally, or see the `deny`
# job in .github/workflows/ci.yml for how CI runs it.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[advisories]
ignore = [
    # rustls-pemfile is unmaintained upstream (archived Aug 2025); no safe upgrade
    # exists yet (rustls-pki-types' PemObject trait would need a real migration,
    # not a version bump). Revisit when we do that migration.
    { id = "RUSTSEC-2025-0134", reason = "no drop-in replacement; requires migrating to rustls-pki-types::PemObject" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
